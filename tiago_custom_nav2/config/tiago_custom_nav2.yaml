controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 30.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    odom_topic: "mobile_base_controller/odom"
    speed_limit_topic: "speed_limit"

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.15
      stateful: True
    # MPPI parameters
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 60
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.4
      vx_min: 0.0
      vx_max: 0.5
      vy_std: 0.0
      vy_min: 0.0
      vy_max: 0.0
      wz_std: 0.25
      wz_min: -0.75
      wz_max: 0.75
      ax_max: 0.5
      ax_min: 0.0
      ay_max: 0.0
      ay_min: 0.0
      az_max: 1.0
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.3
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      reset_period: 1.0 # (only in Humble)
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstrains:
        min_turning_r: 0.0
      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "PathAngleCritic",
          "PreferForwardCritic",
        ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 3
        cost_weight: 3.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0

      use_sim_time: false

      global_frame: "odom"
      robot_base_frame: "base_link"

      robot_radius: 0.25 #To be set by the robot specific configuration
      #footprint: ""

      rolling_window: true
      width: 6
      height: 6
      resolution: 0.01
      track_unknown_space: false

      plugins: ["obstacle_laser_layer", "inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.35

      obstacle_laser_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        footprint_clearing_enabled: False
        scan:
          topic: "/scan"
          expected_update_rate: 0.2 # seconds
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 0.5

      use_sim_time: false

      global_frame: "map"
      robot_base_frame: "base_link"
      robot_radius: 0.25 #To be set by the robot specific configuration
      #footprint: ""

      resolution: 0.05
      track_unknown_space: true

      plugins: ["static_layer", "obstacle_laser_layer", "inflation_layer"]

      obstacle_laser_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        combination_method: 0 # can erase static layer
        footprint_clearing_enabled: False
        scan:
          topic: "/scan"
          expected_update_rate: 0.2 # seconds
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        subscribe_to_updates: true
        map_subscribe_transient_local: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.35
      always_send_full_costmap: True

planner_server:
  ros__parameters:
      planner_plugins: ["GridBased"]
      use_sim_time: false
      expected_planner_frequency: 20.0

      GridBased:
        plugin: "nav2_smac_planner/SmacPlanner2D"
        tolerance: 0.125 # tolerance for planning if unable to reach exact pose, in meters
        downsample_costmap: false # whether or not to downsample the map
        downsampling_factor: 1 # multiplier for the resolution of the costmap layer (e.g. 2 on a 5cm costmap would be 10cm)
        allow_unknown: true # allow traveling in unknown space
        max_iterations: 1000000 # maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
        max_on_approach_iterations: 1000 # maximum number of iterations to attempt to reach goal once in tolerance
        max_planning_time: 2.0 # max time in s for planner to plan, smooth
        cost_travel_multiplier: 1.0 # Cost multiplier to apply to search to steer away from high cost areas. Larger values will place in the center of aisles more exactly (if non-`FREE` cost potential field exists) but take slightly longer to compute. To optimize for speed, a value of 1.0 is reasonable. A reasonable tradeoff value is 2.0. A value of 0.0 effective disables steering away from obstacles and acts like a naive binary search A*.
        use_final_approach_orientation: true # Whether to set the final path pose at the goal's orientation to the requested orientation (false) or in line with the approach angle so the robot doesn't rotate to heading (true)
        smoother:
          max_iterations: 1000
          w_smooth: 0.3
          w_data: 0.2
          tolerance: 1.0e-10


smoother_server:
  ros__parameters:
      use_sim_time: false
      costmap_topic: global_costmap/costmap_raw
      footprint_topic: global_costmap/published_footprint
      robot_base_frame: "base_link"
      transform_timeout: 0.1
      smoother_plugins: ["savitzky_golay_smoother"]
      savitzky_golay_smoother:
        plugin: "nav2_smoother::SavitzkyGolaySmoother"
        refinement_num: 5
        do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: "odom"
    robot_base_frame: "base_link"
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: -1.0
    rotational_acc_lim: 0.5
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 2.5]
    min_velocity: [-0.5, 0.0, -2.5]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    max_accel: [0.5, 0.0, 1.2]
    max_decel: [-0.5, 0.0, -1.2]
    odom_topic: "/mobile_base_controller/odom"
    odom_duration: 0.1
    use_realtime_priority: false

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    use_sim_time: false
    bond_timeout: 10.0
    node_names:
      - bt_navigator
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - waypoint_follower
      - global_costmap
      - local_costmap